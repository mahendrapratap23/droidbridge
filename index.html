<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DroidBridge</title>
    <meta name="description" content="Universal Android-to-macOS file transfer over USB" />
    <link rel="icon" type="image/svg+xml" href="/droidbridge.svg" />
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body>
    <div id="app">
      <!-- Sidebar -->
      <aside id="sidebar">
        <div class="sidebar-header">
          <svg class="logo-icon" width="20" height="20" viewBox="0 0 48 48" fill="none">
            <path d="M14 32V20a10 10 0 0 1 20 0v12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <rect x="12" y="30" width="24" height="8" rx="3" fill="currentColor"/>
            <circle cx="19" cy="16" r="1.5" fill="currentColor"/>
            <circle cx="29" cy="16" r="1.5" fill="currentColor"/>
            <line x1="17" y1="8" x2="14" y2="4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="31" y1="8" x2="34" y2="4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <span class="logo-text">DroidBridge</span>
        </div>

        <div class="sidebar-section">
          <div class="section-label">
            <span>Devices</span>
            <button id="btn-scan" class="icon-btn" title="Scan for devices">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                <path d="M14 8A6 6 0 1 1 2 8a6 6 0 0 1 12 0Z" stroke="currentColor" stroke-width="1.5"/>
                <path d="M8 4v4l2.5 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div id="device-list"></div>
        </div>

        <div class="sidebar-section" id="storage-section" hidden>
          <div class="section-label"><span>Storage</span></div>
          <div id="storage-list"></div>
        </div>
      </aside>

      <!-- Main content -->
      <main id="main-content">
        <!-- Toolbar -->
        <div id="toolbar">
          <div id="toolbar-left">
            <button id="btn-back" class="toolbar-btn" disabled title="Go back">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <nav id="breadcrumb">
              <span class="crumb crumb-root">No device</span>
            </nav>
          </div>
          <div id="toolbar-right">
            <button id="btn-upload" class="toolbar-btn" disabled title="Upload files to device">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
                <path d="M8 10V2m0 0L5 5m3-3 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2 10v3a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <span>Upload</span>
            </button>
            <button id="btn-download" class="toolbar-btn" disabled title="Download selected files">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
                <path d="M8 2v8m0 0 3-3M8 10 5 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2 10v3a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <span>Download</span>
            </button>
            <button id="btn-delete" class="toolbar-btn toolbar-btn-danger" disabled title="Delete selected files">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
                <path d="M3 4h10M6 4V3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1m1.5 0-.5 9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1l-.5-9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- File browser -->
        <div id="file-browser">
          <!-- Empty state (shown when no device connected) -->
          <div id="empty-state">
            <div class="empty-illustration">
              <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                <rect x="16" y="8" width="32" height="48" rx="4" stroke="currentColor" stroke-width="2" opacity="0.3"/>
                <rect x="26" y="50" width="12" height="2" rx="1" fill="currentColor" opacity="0.3"/>
                <path d="M32 24v8m0 0-3-3m3 3 3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
              </svg>
            </div>
            <h2 class="empty-title">Connect Your Android Device</h2>
            <p class="empty-description">
              Plug in via USB cable and select <strong>File Transfer (MTP)</strong> mode on your phone
            </p>
            <button id="btn-scan-empty" class="btn-primary">Scan for Devices</button>
          </div>

          <!-- File table (shown when browsing) -->
          <div id="file-table-container" hidden>
            <table id="file-table">
              <thead>
                <tr>
                  <th class="col-check"><input type="checkbox" id="select-all" /></th>
                  <th class="col-name" data-sort="name">Name</th>
                  <th class="col-size" data-sort="size">Size</th>
                  <th class="col-modified" data-sort="modified">Modified</th>
                </tr>
              </thead>
              <tbody id="file-list"></tbody>
            </table>
          </div>

          <!-- Loading state -->
          <div id="loading-state" hidden>
            <div class="spinner"></div>
            <p class="loading-text">Loading…</p>
          </div>

          <!-- Error state -->
          <div id="error-state" hidden>
            <div class="error-icon">⚠</div>
            <h3 class="error-title">Something went wrong</h3>
            <p id="error-message" class="error-description"></p>
            <button id="btn-retry" class="btn-secondary">Retry</button>
          </div>
        </div>

        <!-- Transfer panel -->
        <div id="transfer-panel" hidden>
          <div class="transfer-header">
            <span class="transfer-title">Transfers</span>
            <button id="btn-close-transfers" class="icon-btn" title="Close">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div id="transfer-list"></div>
        </div>
      </main>
    </div>

    <!-- Status bar -->
    <footer id="status-bar">
      <span id="status-text">Ready</span>
      <span id="status-info"></span>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2430" />
      <stop offset="100%" stop-color="#0e1117" />
    </linearGradient>
    <linearGradient id="androidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DDC84" />
      <stop offset="100%" stop-color="#00C9A7" />
    </linearGradient>
    <linearGradient id="cableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)" stroke="#2d3748" stroke-width="2" />

  <!-- Inner glow border -->
  <rect x="34" y="34" width="444" height="444" rx="94" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- Android phone silhouette / symbol -->
  <g filter="url(#shadow)" transform="translate(146, 110)">
    <!-- Android head shape -->
    <path d="M 30,120 A 80,80 0 0,1 190,120 Z" fill="url(#androidGrad)" />
    <!-- Antennas -->
    <line x1="60" y1="65" x2="45" y2="40" stroke="url(#androidGrad)" stroke-width="8" stroke-linecap="round" />
    <line x1="160" y1="65" x2="175" y2="40" stroke="url(#androidGrad)" stroke-width="8" stroke-linecap="round" />
    <!-- Eyes -->
    <circle cx="75" cy="95" r="7" fill="#0e1117" />
    <circle cx="145" cy="95" r="7" fill="#0e1117" />

    <!-- Phone body / USB bridge -->
    <rect x="30" y="132" width="160" height="150" rx="16" fill="#18202c" stroke="url(#androidGrad)" stroke-width="4" />
    
    <!-- Screen content: transfer arrows -->
    <path d="M 85,190 L 135,190 M 120,175 L 135,190 L 120,205" stroke="url(#cableGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 135,225 L 85,225 M 100,210 L 85,225 L 100,240" stroke="url(#androidGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- USB connector symbol at bottom -->
  <path d="M 236,410 L 276,410 L 276,435 L 236,435 Z" fill="#475569" rx="3" />
  <rect x="244" y="435" width="24" height="25" rx="4" fill="#64748b" />
</svg>
